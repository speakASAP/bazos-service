apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazos-service-secret
  namespace: statex-apps
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bazos-service-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/prod/bazos-service
        property: DATABASE_URL
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/prod/bazos-service
        property: JWT_SECRET
    - secretKey: PAYMENT_API_KEY
      remoteRef:
        key: secret/prod/bazos-service
        property: PAYMENT_API_KEY
    - secretKey: PAYMENT_APPLICATION_ID
      remoteRef:
        key: secret/prod/bazos-service
        property: PAYMENT_APPLICATION_ID
    - secretKey: PAYMENT_WEBHOOK_API_KEY
      remoteRef:
        key: secret/prod/bazos-service
        property: PAYMENT_WEBHOOK_API_KEY

    # Inbound guard for the marketing-microservice -> bazos-service order-affinity
    # replay lane (orders.controller.ts assertMarketingService). Its own opaque
    # secret, NOT JWT_TOKEN: that property held the shared a2880693 value, which
    # was simultaneously the credential for five other services. marketing reads
    # this same property as ORDER_AFFINITY_BAZOS_REPLAY_TOKEN, so one Vault write
    # moves both sides of the lane at once.
    - secretKey: BAZOS_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/bazos-service
        property: MARKETING_REPLAY_TOKEN
    # Per-pair RS256 principal for the bazos-service -> orders-microservice lane.
    # Its own Vault property, NOT JWT_TOKEN: that property is the shared a2880693
    # value and also feeds BAZOS_INTERNAL_SERVICE_TOKEN above.
    - secretKey: ORDERS_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/bazos-service
        property: ORDERS_SERVICE_TOKEN
    - secretKey: WAREHOUSE_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/bazos-service
        property: WAREHOUSE_SERVICE_TOKEN
    - secretKey: CATALOG_INTERNAL_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/auth-microservice
        property: CATALOG_INTERNAL_SERVICE_TOKEN
    # Per-pair RS256 principal for bazos-service -> catalog-microservice
    # (svc-bazos-service--catalog-microservice@internal.alfares.cz), role
    # internal:catalog-microservice:write -- bazos POSTs products, media and
    # media uploads and PUTs products, so it is classified by effect as a write.
    # Replaces the shared static x-internal-service-token above, which seven
    # services held from one Vault property and which was therefore neither
    # per-pair nor revocable per caller.
    - secretKey: CATALOG_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/bazos-service
        property: CATALOG_SERVICE_TOKEN
    # Ingest credential for posting credential self-reports to monitoring
    # (SERVICE_CREDENTIAL_PROBER_PLAN.md Task A). Not a probe credential: it
    # authenticates the report, never the lane being reported on.
    #
    # NOTE the Vault property is PLURAL. monitoring's own ExternalSecret maps env
    # NOTIFICATION_SERVICE_TOKEN <- Vault NOTIFICATIONS_SERVICE_TOKEN, and
    # MonitoringIngestGuard compares against that running value. The singular key
    # also exists in monitoring's path with a stale value the guard rejects.
    - secretKey: NOTIFICATION_SERVICE_TOKEN
      remoteRef:
        key: secret/prod/monitoring-microservice
        property: NOTIFICATIONS_SERVICE_TOKEN
